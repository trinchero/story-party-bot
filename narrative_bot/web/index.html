<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>StoryPartyBot</title><link rel="stylesheet" href="/style.css"><script src="/app.js" defer></script></head><body><aside><b>StoryPartyBot</b><nav><button data-view="overview">Partida</button><button data-view="people">Asignaciones</button><button data-view="phases">Mensajes</button></nav></aside><main><header><h1 id="view-title">Partida</h1><span id="connection">Conectando…</span></header><p id="error" role="alert" hidden></p><section id="view-overview"><p id="story-title" class="muted"></p><div class="panel"><p id="assignment-state" class="muted"></p><h2 id="phase-title">Cargando…</h2><div id="progress" class="progress" role="img"></div><p id="progress-text"></p><p id="next-step" class="muted"></p><button id="main-action" class="primary" disabled>Continuar</button></div><button id="close-game" class="danger" hidden>Terminar partida</button></section><section id="view-people" hidden><p class="muted">Personas registradas en Telegram y su personaje.</p><div id="people-list" class="panel"></div><p id="unassigned" class="muted"></p><button id="confirm-roles" class="primary" hidden>Confirmar personajes</button></section><section id="view-phases" hidden><label for="phase-select">Fase</label><select id="phase-select"></select><p id="phase-state" class="muted"></p><div id="messages" class="panel"></div><p class="muted small">Enviado significa aceptado por Telegram, no leído.</p></section><dialog id="confirm-action" aria-labelledby="confirm-title"><h2 id="confirm-title"></h2><p id="confirm-description"></p><pre id="confirm-pending"></pre><p id="action-error" role="alert"></p><button id="cancel-action">No, volver</button> <button id="execute-action" class="primary">Sí, confirmar</button></dialog></main></body></html>
